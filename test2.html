<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caro Vô Tận - Siêu Cấp AI</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            pointer-events: none; width: 250px;
        }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #333; }
        .turn-x { color: #e74c3c; font-weight: bold; }
        .turn-o { color: #3498db; font-weight: bold; }
        .info { font-size: 0.85rem; color: #555; line-height: 1.5; margin-bottom: 15px; }
        #reset { 
            margin-top: 10px; pointer-events: auto; cursor: pointer;
            background: #2c3e50; color: white; border: none; padding: 10px 15px; 
            border-radius: 6px; width: 100%; font-weight: bold; transition: 0.3s;
        }
        #reset:hover { background: #34495e; }
    </style>
</head>
<body>

<div id="ui">
    <h2>Caro Vô Tận AI</h2>
    <div id="status">Lượt của: <span class="turn-x">Bạn (X)</span></div>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
    <div class="info">
        • <b>Bạn:</b> Quân đỏ (X)<br>
        • <b>Máy:</b> Quân xanh (O)<br>
        • <b>Chuột trái:</b> Đánh cờ<br>
        • <b>Kéo chuột:</b> Di chuyển bàn cờ<br>
        • <b>Lăn chuột:</b> Phóng to/Thu nhỏ
    </div>
    <button id="reset" onclick="resetGame()">CHƠI LẠI</button>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let board = {}; 
    let turn = "X";
    let gameOver = false;
    let camera = { x: 0, y: 0, zoom: 1 };
    let isDragging = false;
    let lastMousePos = { x: 0, y: 0 };
    const cellSize = 40;

    function init() {
        window.addEventListener('resize', resize);
        resize();
        canvas.addEventListener('mousedown', (e) => { isDragging = false; lastMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    isDragging = true;
                    camera.x += dx; camera.y += dy;
                    lastMousePos = { x: e.clientX, y: e.clientY };
                }
            }
        });
        canvas.addEventListener('wheel', (e) => {
            const zoomSpeed = 1.1;
            camera.zoom *= (e.deltaY > 0 ? 1/zoomSpeed : zoomSpeed);
            camera.zoom = Math.min(Math.max(camera.zoom, 0.2), 3);
        });
        canvas.addEventListener('click', handleClick);
        render();
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    function screenToWorld(sx, sy) {
        const x = Math.floor((sx - canvas.width/2 - camera.x) / (cellSize * camera.zoom));
        const y = Math.floor((sy - canvas.height/2 - camera.y) / (cellSize * camera.zoom));
        return { x, y };
    }

    function handleClick(e) {
        if (isDragging || gameOver || turn === "O") return;
        const pos = screenToWorld(e.clientX, e.clientY);
        if (!board[`${pos.x},${pos.y}`]) {
            makeMove(pos.x, pos.y, "X");
            if (!gameOver) {
                statusEl.innerHTML = `Máy đang tính toán...`;
                setTimeout(aiMove, 100); 
            }
        }
    }

    function makeMove(x, y, p) {
        board[`${x},${y}`] = p;
        if (checkWin(x, y, p)) {
            statusEl.innerHTML = p === "X" ? "<span class='turn-x'>BẠN THẮNG!</span>" : "<span class='turn-o'>MÁY THẮNG!</span>";
            gameOver = true;
        } else {
            turn = p === "X" ? "O" : "X";
            statusEl.innerHTML = `Lượt của: <span class="turn-${turn.toLowerCase()}">${turn === "X" ? "Bạn (X)" : "Máy (O)"}</span>`;
        }
    }

    // --- AI MINIMAX + ALPHA-BETA PRUNING ---
    function aiMove() {
        if (gameOver) return;
        let bestScore = -Infinity;
        let move = null;
        let candidates = getCandidates();

        if (candidates.length === 0) {
            makeMove(0, 0, "O");
            return;
        }

        // Độ sâu càng cao càng khó (2-3 là ổn cho trình duyệt)
        for (let cand of candidates) {
            board[`${cand.x},${cand.y}`] = "O";
            let score = minimax(4, -Infinity, Infinity, false);
            delete board[`${cand.x},${cand.y}`];
            if (score > bestScore) {
                bestScore = score;
                move = cand;
            }
        }
        if (move) makeMove(move.x, move.y, "O");
    }

    function minimax(depth, alpha, beta, isMaximizing) {
        if (depth === 0) return evaluateBoard();
        let candidates = getCandidates();
        if (isMaximizing) {
            let maxEval = -Infinity;
            for (let cand of candidates) {
                board[`${cand.x},${cand.y}`] = "O";
                let ev = minimax(depth - 1, alpha, beta, false);
                delete board[`${cand.x},${cand.y}`];
                maxEval = Math.max(maxEval, ev);
                alpha = Math.max(alpha, ev);
                if (beta <= alpha) break;
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (let cand of candidates) {
                board[`${cand.x},${cand.y}`] = "X";
                let ev = minimax(depth - 1, alpha, beta, true);
                delete board[`${cand.x},${cand.y}`];
                minEval = Math.min(minEval, ev);
                beta = Math.min(beta, ev);
                if (beta <= alpha) break;
            }
            return minEval;
        }
    }

    function getCandidates() {
        let coords = new Set();
        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            for (let i = -2; i <= 2; i++) {
                for (let j = -2; j <= 2; j++) {
                    let k = `${x+i},${y+j}`;
                    if (!board[k]) coords.add(k);
                }
            }
        }
        return Array.from(coords).map(k => {
            let [x, y] = k.split(',').map(Number);
            return {x, y};
        });
    }

    function evaluateBoard() {
        let score = 0;
        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            let p = board[key];
            let s = getCellScore(x, y, p);
            score += (p === "O" ? s : -s * 1.3); // AI ưu tiên thủ trước công sau
        }
        return score;
    }

    function getCellScore(x, y, p) {
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        let total = 0;
        for (let [dx, dy] of dirs) {
            let {c, b1, b2} = countDetailed(x, y, dx, dy, p);
            if (c >= 5) total += 100000;
            else if (c === 4) total += (b1 && b2) ? 0 : (b1 || b2 ? 2000 : 8000);
            else if (c === 3) total += (b1 && b2) ? 0 : (b1 || b2 ? 500 : 2000);
            else if (c === 2) total += (b1 && b2) ? 0 : 100;
        }
        return total;
    }

    function countDetailed(x, y, dx, dy, p) {
        let c = 1;
        let nx = x + dx, ny = y + dy;
        while (board[`${nx},${ny}`] === p) { c++; nx += dx; ny += dy; }
        let b1 = board[`${nx},${ny}`] !== undefined && board[`${nx},${ny}`] !== p;
        nx = x - dx; ny = y - dy;
        while (board[`${nx},${ny}`] === p) { c++; nx -= dx; ny -= dy; }
        let b2 = board[`${nx},${ny}`] !== undefined && board[`${nx},${ny}`] !== p;
        return {c, b1, b2};
    }

    function checkWin(x, y, p) {
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        for (let [dx, dy] of dirs) {
            if (countDetailed(x, y, dx, dy, p).c >= 5) return true;
        }
        return false;
    }

    function render() {
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const currentCell = cellSize * camera.zoom;
        const offX = (canvas.width/2 + camera.x) % currentCell;
        const offY = (canvas.height/2 + camera.y) % currentCell;

        ctx.beginPath(); ctx.strokeStyle = "#333";
        for (let x = offX; x < canvas.width; x += currentCell) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
        for (let y = offY; y < canvas.height; y += currentCell) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
        ctx.stroke();

        for (let key in board) {
            const [bx, by] = key.split(',').map(Number);
            const pX = bx * currentCell + canvas.width/2 + camera.x;
            const pY = by * currentCell + canvas.height/2 + camera.y;
            if (pX + currentCell > 0 && pX < canvas.width && pY + currentCell > 0 && pY < canvas.height) {
                drawPiece(pX, pY, board[key], currentCell);
            }
        }
        requestAnimationFrame(render);
    }

    function drawPiece(x, y, type, size) {
        ctx.lineWidth = size * 0.15;
        const p = size * 0.25;
        ctx.strokeStyle = type === "X" ? "#ff4d4d" : "#00a8ff";
        ctx.shadowBlur = 10; ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        if (type === "X") {
            ctx.moveTo(x+p, y+p); ctx.lineTo(x+size-p, y+size-p);
            ctx.moveTo(x+size-p, y+p); ctx.lineTo(x+p, y+size-p);
        } else {
            ctx.arc(x+size/2, y+size/2, size/2-p, 0, Math.PI*2);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function resetGame() {
        board = {}; turn = "X"; gameOver = false;
        camera = { x: 0, y: 0, zoom: 1 };
        statusEl.innerHTML = `Lượt của: <span class="turn-x">Bạn (X)</span>`;
    }

    init();
</script>
</body>
</html>
