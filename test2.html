<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caro Vô Tận vs AI</title>
    <style>
        body { margin: 0; background: #2c3e50; font-family: sans-serif; overflow: hidden; color: white; }
        #controls { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
        
        /* Container cho phép kéo thả/cuộn tự do */
        #game-viewport {
            width: 100vw;
            height: 100vh;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #board {
            display: grid;
            background-color: #7f8c8d;
            gap: 1px;
            border: 2px solid #7f8c8d;
            position: relative;
        }

        .cell {
            width: 35px;
            height: 35px;
            background-color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover { background-color: #bdc3c7; }
        .cell.x { color: #e74c3c; }
        .cell.o { color: #2980b9; }
        .last-move { background-color: #f1c40f !important; box-shadow: inset 0 0 8px rgba(0,0,0,0.5); }
        
        button { cursor: pointer; padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

<div id="controls">
    <div id="status">Đang khởi tạo...</div>
    <button onclick="location.reload()" style="margin-top:10px">Chơi lại</button>
    <p style="font-size: 12px; color: #ccc;">* Bàn cờ tự mở rộng khi bạn đi ra biên.</p>
</div>

<div id="game-viewport">
    <div id="board"></div>
</div>

<script>
    const boardData = {}; // Lưu dữ liệu dưới dạng "x,y": "X" hoặc "O"
    let minR = 0, maxR = 15, minC = 0, maxC = 15; // Giới hạn hiển thị hiện tại
    let isHumanTurn = false;
    let gameActive = true;
    let lastElement = null;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    function renderBoard() {
        boardEl.style.gridTemplateColumns = `repeat(${maxC - minC + 1}, 35px)`;
        boardEl.innerHTML = '';
        
        for (let r = minR; r <= maxR; r++) {
            for (let c = minC; c <= maxC; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const val = boardData[`${r},${c}`];
                if (val) {
                    cell.innerText = val;
                    cell.classList.add(val.toLowerCase());
                }
                cell.onclick = () => handleMove(r, c);
                boardEl.appendChild(cell);
            }
        }
    }

    function handleMove(r, c) {
        if (!isHumanTurn || !gameActive || boardData[`${r},${c}`]) return;

        placeMove(r, c, 'X');
        if (checkWin(r, c, 'X')) {
            statusEl.innerText = "BẠN THẮNG!";
            gameActive = false;
            return;
        }

        isHumanTurn = false;
        statusEl.innerText = "AI đang tính toán...";
        setTimeout(aiThink, 300);
    }

    function placeMove(r, c, sym) {
        boardData[`${r},${c}`] = sym;
        
        // Mở rộng biên nếu đánh sát rìa
        if (r <= minR) minR--;
        if (r >= maxR) maxR++;
        if (c <= minC) minC--;
        if (c >= maxC) maxC++;
        
        renderBoard();
        
        // Highlight nước cuối
        const cells = boardEl.children;
        const index = (r - minR) * (maxC - minC + 1) + (c - minC);
        if (lastElement) lastElement.classList.remove('last-move');
        cells[index].classList.add('last-move');
        lastElement = cells[index];
    }

    function aiThink() {
        if (!gameActive) return;
        let bestScore = -Infinity;
        let bestMove = null;

        // AI chỉ quét các ô trống có hàng xóm trong phạm vi 2 ô để tối ưu
        const candidates = getCandidates();
        
        for (let move of candidates) {
            let score = evaluate(move.r, move.c);
            if (score > bestScore) {
                bestScore = score;
                bestMove = move;
            }
        }

        if (bestMove) {
            placeMove(bestMove.r, bestMove.c, 'O');
            if (checkWin(bestMove.r, bestMove.c, 'O')) {
                statusEl.innerText = "AI THẮNG!";
                gameActive = false;
            } else {
                isHumanTurn = true;
                statusEl.innerText = "Lượt của bạn (X)";
            }
        }
    }

    function getCandidates() {
        const set = new Set();
        for (let key in boardData) {
            const [r, c] = key.split(',').map(Number);
            for (let i = -2; i <= 2; i++) {
                for (let j = -2; j <= 2; j++) {
                    if (!boardData[`${r+i},${c+j}`]) set.add(`${r+i},${c+j}`);
                }
            }
        }
        return Array.from(set).map(s => {
            const [r, c] = s.split(',').map(Number);
            return {r, c};
        });
    }

    function evaluate(r, c) {
        return getLineScore(r, c, 'O', 'X') + getLineScore(r, c, 'X', 'O') * 1.1; 
    }

    function getLineScore(row, col, me, opp) {
        let total = 0;
        const dirs = [[0,1],[1,0],[1,1],[1,-1]];
        for (let [dr, dc] of dirs) {
            let count = 0, open = 0;
            // Tiến
            let r = row + dr, c = col + dc;
            while(boardData[`${r},${c}`] === me) { count++; r+=dr; c+=dc; }
            if(!boardData[`${r},${c}`]) open++;
            // Lùi
            r = row - dr; c = col - dc;
            while(boardData[`${r},${c}`] === me) { count++; r-=dr; c-=dc; }
            if(!boardData[`${r},${c}`]) open++;

            if (count >= 4) total += 100000;
            else if (count === 3) total += (open === 2 ? 10000 : 500);
            else if (count === 2) total += (open === 2 ? 500 : 100);
            else if (count === 1) total += 10;
        }
        return total;
    }

    function checkWin(r, c, sym) {
        const dirs = [[0,1],[1,0],[1,1],[1,-1]];
        for (let [dr, dc] of dirs) {
            let count = 1;
            let i = r + dr, j = c + dc;
            while(boardData[`${i},${j}`] === sym) { count++; i+=dr; j+=dc; }
            i = r - dr; j = c - dc;
            while(boardData[`${i},${j}`] === sym) { count++; i-=dr; j-=dc; }
            if (count >= 5) return true;
        }
        return false;
    }

    // Khởi tạo lượt đi ngẫu nhiên
    isHumanTurn = Math.random() > 0.5;
    statusEl.innerText = isHumanTurn ? "Bạn đi trước (X)" : "AI đi trước (O)";
    renderBoard();
    if (!isHumanTurn) setTimeout(aiThink, 500);

</script>
</body>
</html>
