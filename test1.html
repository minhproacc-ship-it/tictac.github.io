<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caro GOD MODE - ULTIMATE (Tối ưu hóa)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', monospace; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(10, 10, 10, 0.95); color: #fff;
            padding: 25px; border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            border: 1px solid #555; width: 280px;
            pointer-events: none;
        }
        h2 { margin: 0 0 15px 0; font-size: 1.5rem; color: #ff3838; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px #ff3838; }
        .info { font-size: 0.9rem; color: #ccc; line-height: 1.6; margin-bottom: 20px; }
        .turn-x { color: #fff; font-weight: bold; }
        .turn-o { color: #ff3838; font-weight: bold; }
        #reset {
            pointer-events: auto; cursor: pointer;
            background: transparent; color: #ff3838; border: 1px solid #ff3838;
            padding: 12px; border-radius: 4px; width: 100%; font-weight: bold;
            text-transform: uppercase; transition: 0.3s;
        }
        #reset:hover { background: #ff3838; color: #fff; box-shadow: 0 0 20px #ff3838; }
       
        #thinking-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 100;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }
        .loader {
            border: 4px solid #333; border-top: 4px solid #ff3838;
            border-radius: 50%; width: 60px; height: 60px;
            animation: spin 0.8s linear infinite; margin-bottom: 15px;
        }
        .loading-text { color: #ff3838; font-weight: bold; letter-spacing: 1px; animation: pulse 1s infinite;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
<div id="ui">
    <h2>GOD MODE: MAX (Tối ưu)</h2>
    <div id="status">Đang khởi tạo...</div>
    <div class="info">
        • AI: <span class="turn-o">Quái vật (O)</span><br>
        • Bạn: <span class="turn-x">Người chơi (X)</span><br>
        • Độ sâu: <b>Depth 5 (Cực khó, không treo máy)</b><br>
        • AI luôn đi trước và đánh vào tâm.<br>
        • Tối ưu: Giảm độ sâu, tăng cắt tỉa, giới hạn nước đi, heuristic mạnh hơn.
    </div>
    <button id="reset" onclick="initGame()">Thử lại</button>
</div>
<div id="thinking-overlay">
    <div class="loader"></div>
    <div class="loading-text">AI ĐANG TÍNH TOÁN (DEPTH 5)...</div>
</div>
<canvas id="game"></canvas>
<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('thinking-overlay');
    // --- CẤU HÌNH GAME ---
    const CELL_SIZE = 45;
    let board = {};
    let turn = "O";
    let gameOver = false;
    let lastMove = null;
    let camera = { x: 0, y: 0, zoom: 1 };
   
    let minX = 0, maxX = 0, minY = 0, maxY = 0;
    let moveCount = 0;
    // --- CẤU HÌNH AI (TỐI ƯU HÓA) ---
    const AI_DEPTH = 5; // Giảm về 5 để tránh treo máy, nhưng vẫn cực mạnh nhờ tối ưu
    const MAX_TOP_MOVES = 10; // Giới hạn top moves để duyệt sâu
    const MAX_BRANCH = 6; // Giới hạn nhánh mỗi mức để giảm thời gian
   
    // Heuristic Scores (Tăng trọng số chặn để AI gần như bất bại)
    const WIN_SCORE = 1000000000;
    const LIVE_4 = 10000000;
    const DEAD_4 = 5000000;
    const LIVE_3 = 1000000;
    const DEAD_3 = 100000;
    const LIVE_2 = 1000;
    const DEAD_2 = 200;
    const BLOCK_BONUS = 500;
    let isDragging = false;
    let lastMousePos = {x:0, y:0};

    function initGame() {
        board = {};
        gameOver = false;
        lastMove = null;
        moveCount = 0;
        camera = { x: 0, y: 0, zoom: 1 };
        minX = 0; maxX = 0; minY = 0; maxY = 0;
       
        turn = "O";
       
        statusEl.innerHTML = `Lượt: <span class="turn-o">AI (O) ĐI TRƯỚC</span>`;
       
        setTimeout(() => {
            makeMove(0, 0, "O");
        }, 500);
        render();
    }

    // --- EVENTS ---
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    window.dispatchEvent(new Event('resize'));
    canvas.addEventListener('mousedown', e => { isDragging = false; lastMousePos = {x: e.clientX, y: e.clientY}; });
    window.addEventListener('mousemove', e => {
        if (e.buttons === 1) {
            const dx = e.clientX - lastMousePos.x;
            const dy = e.clientY - lastMousePos.y;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                isDragging = true;
                camera.x += dx; camera.y += dy;
                lastMousePos = {x: e.clientX, y: e.clientY};
            }
        }
    });
    canvas.addEventListener('wheel', e => {
        camera.zoom *= (e.deltaY > 0 ? 0.9 : 1.1);
        camera.zoom = Math.min(Math.max(camera.zoom, 0.4), 2.0);
    });
    canvas.addEventListener('click', e => {
        if (isDragging || gameOver || turn === "O") return;
        const pos = screenToWorld(e.clientX, e.clientY);
       
        if (!board[`${pos.x},${pos.y}`]) {
            makeMove(pos.x, pos.y, "X");
            if (!gameOver) {
                overlay.style.display = "flex";
                setTimeout(() => {
                    aiTurn();
                    overlay.style.display = "none";
                }, 100); // Tăng delay nhẹ để UI mượt hơn
            }
        }
    });
    function screenToWorld(sx, sy) {
        const x = Math.floor((sx - canvas.width/2 - camera.x) / (CELL_SIZE * camera.zoom));
        const y = Math.floor((sy - canvas.height/2 - camera.y) / (CELL_SIZE * camera.zoom));
        return {x, y};
    }
    function makeMove(x, y, p) {
        board[`${x},${y}`] = p;
        lastMove = {x, y};
        moveCount++;
        updateBounds(x, y);
        if (checkWin(x, y, p)) {
            statusEl.innerHTML = p === "X" ? "<span class='turn-x'>CHIẾN THẮNG (LỖI GAME?)</span>" : "<span class='turn-o'>BẠN ĐÃ THUA</span>";
            gameOver = true;
        } else {
            turn = p === "X" ? "O" : "X";
            statusEl.innerHTML = `Lượt: <span class="turn-${turn.toLowerCase()}">${turn === "X" ? "Bạn (X)" : "AI (O)"}</span>`;
        }
        render();
    }
    function updateBounds(x, y) {
        if (moveCount === 1) {
            minX = maxX = x;
            minY = maxY = y;
        } else {
            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
    }
    // --- AI ENGINE (TỐI ƯU) ---
    function aiTurn() {
        const urgentMove = checkUrgentMove();
        if (urgentMove) {
            makeMove(urgentMove.x, urgentMove.y, "O");
            return;
        }
        let bestScore = -Infinity;
        let bestMove = null;
       
        let moves = generateMoves();
       
        // Sắp xếp nước đi cực tốt (heuristic + khoảng cách)
        moves.sort((a, b) => {
            const hA = evaluateMove(a.x, a.y, "O");
            const hB = evaluateMove(b.x, b.y, "O");
            const distA = Math.abs(a.x - lastMove.x) + Math.abs(a.y - lastMove.y);
            const distB = Math.abs(b.x - lastMove.x) + Math.abs(b.y - lastMove.y);
            return (hB + 0.1 * distB) - (hA + 0.1 * distA);
        });
       
        const topMoves = moves.slice(0, MAX_TOP_MOVES);
       
        for (let move of topMoves) {
            board[`${move.x},${move.y}`] = "O";
            let score = minimax(AI_DEPTH - 1, -Infinity, Infinity, false);
            delete board[`${move.x},${move.y}`];
            if (score > bestScore) {
                bestScore = score;
                bestMove = move;
            }
        }
        if (bestMove) makeMove(bestMove.x, bestMove.y, "O");
    }
    function checkUrgentMove() {
        const moves = generateMoves();
        // Thắng ngay
        for (let m of moves) {
            board[`${m.x},${m.y}`] = "O";
            if (checkWin(m.x, m.y, "O")) { delete board[`${m.x},${m.y}`]; return m; }
            delete board[`${m.x},${m.y}`];
        }
        // Chặn thua
        for (let m of moves) {
            board[`${m.x},${m.y}`] = "X";
            if (checkWin(m.x, m.y, "X")) { delete board[`${m.x},${m.y}`]; return m; }
            delete board[`${m.x},${m.y}`];
        }
        return null;
    }
    function minimax(depth, alpha, beta, isMaximizing) {
        if (depth === 0) return evaluateBoard();
        let moves = generateMoves();
       
        // Sắp xếp trong đệ quy
        moves.sort((a, b) => {
            const distA = Math.abs(a.x - lastMove.x) + Math.abs(a.y - lastMove.y);
            const distB = Math.abs(b.x - lastMove.x) + Math.abs(b.y - lastMove.y);
            const heurA = evaluateMove(a.x, a.y, isMaximizing ? "O" : "X");
            const heurB = evaluateMove(b.x, b.y, isMaximizing ? "O" : "X");
            return (heurB + distB) - (heurA + distA);
        });
       
        const searchMoves = moves.slice(0, Math.max(3, MAX_BRANCH + depth));
       
        if (isMaximizing) {
            let maxEval = -Infinity;
            for (let move of searchMoves) {
                board[`${move.x},${move.y}`] = "O";
                if (checkWin(move.x, move.y, "O")) { delete board[`${move.x},${move.y}`]; return WIN_SCORE; }
                let eval = minimax(depth - 1, alpha, beta, false);
                delete board[`${move.x},${move.y}`];
                maxEval = Math.max(maxEval, eval);
                alpha = Math.max(alpha, eval);
                if (beta <= alpha) break;
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (let move of searchMoves) {
                board[`${move.x},${move.y}`] = "X";
                if (checkWin(move.x, move.y, "X")) { delete board[`${move.x},${move.y}`]; return -WIN_SCORE; }
                let eval = minimax(depth - 1, alpha, beta, true);
                delete board[`${move.x},${move.y}`];
                minEval = Math.min(minEval, eval);
                beta = Math.min(beta, eval);
                if (beta <= alpha) break;
            }
            return minEval;
        }
    }
    function evaluateBoard() {
        let score = 0;
        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            let p = board[key];
            let pointScore = evaluatePoint(x, y, p);
            if (p === "O") score += pointScore;
            else score -= pointScore * 1.5; // Tăng hệ số phòng thủ để AI chắc chắn hơn
        }
        return score;
    }
    function evaluateMove(x, y, p) {
        board[`${x},${y}`] = p;
        let score = evaluateBoard();
        delete board[`${x},${y}`];
        return score;
    }
    function evaluatePoint(x, y, p) {
        let total = 0;
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        for (let [dx, dy] of dirs) {
            let line = getLineStr(x, y, dx, dy);
            total += matchPattern(line, p);
        }
        return total;
    }
    function getLineStr(x, y, dx, dy) {
        let s = "";
        for (let i = -5; i <= 5; i++) {
            let val = board[`${x + dx*i},${y + dy*i}`];
            s += val === undefined ? "_" : (val === "O" ? "M" : "E");
        }
        return s;
    }
    function matchPattern(s, p) {
        let score = 0;
        if (s.includes("MMMMM")) return WIN_SCORE;
        if (s.includes("_MMMM_")) score += LIVE_4;
        if (s.includes("MMMM_") || s.includes("_MMMM") || s.includes("MM_MM") || s.includes("M_MMM") || s.includes("MMM_M")) score += DEAD_4;
        if (s.includes("_MMM_") || s.includes("_M_MM_") || s.includes("_MM_M_")) score += LIVE_3;
        if (s.includes("MMM__") || s.includes("__MMM") || s.includes("M_MM") || s.includes("MM_M")) score += DEAD_3;
        if (s.includes("_MM_") || s.includes("_M_M_")) score += LIVE_2;
        if (s.includes("MM__") || s.includes("__MM") || s.includes("M_M_")) score += DEAD_2;
        if (s.split('E').length > 2) score += BLOCK_BONUS; // Bonus chặn nhiều
        return score;
    }
    function generateMoves() {
        let moves = new Set();
        const expand = 3; // Tăng nhẹ để bao quát threat
        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            for (let i = -expand; i <= expand; i++) {
                for (let j = -expand; j <= expand; j++) {
                    if (i===0 && j===0) continue;
                    let nx = x+i, ny = y+j;
                    if (!board[`${nx},${ny}`]) {
                        moves.add(`${nx},${ny}`);
                    }
                }
            }
        }
        return Array.from(moves).map(k => {
            let [x, y] = k.split(',').map(Number);
            return {x, y};
        });
    }
    function checkWin(x, y, p) {
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        for (let [dx, dy] of dirs) {
            let count = 1;
            let i = 1;
            while (board[`${x + dx*i},${y + dy*i}`] === p) { count++; i++; }
            i = 1;
            while (board[`${x - dx*i},${y - dy*i}`] === p) { count++; i++; }
            if (count >= 5) return true;
        }
        return false;
    }
    // --- RENDER ---
    function render() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
       
        const currentCell = CELL_SIZE * camera.zoom;
        const offX = (canvas.width/2 + camera.x) % currentCell;
        const offY = (canvas.height/2 + camera.y) % currentCell;
        ctx.beginPath(); ctx.strokeStyle = "#222"; ctx.lineWidth = 1;
        for (let x = offX; x < canvas.width; x += currentCell) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
        for (let y = offY; y < canvas.height; y += currentCell) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
        ctx.stroke();
        if (lastMove) {
            const lx = lastMove.x * currentCell + canvas.width/2 + camera.x;
            const ly = lastMove.y * currentCell + canvas.height/2 + camera.y;
            ctx.fillStyle = "rgba(255, 50, 50, 0.2)";
            ctx.fillRect(lx, ly, currentCell, currentCell);
            ctx.strokeStyle = "#ff3838"; ctx.lineWidth = 2;
            ctx.strokeRect(lx, ly, currentCell, currentCell);
        }
        for (let key in board) {
            const [bx, by] = key.split(',').map(Number);
            const pX = bx * currentCell + canvas.width/2 + camera.x;
            const pY = by * currentCell + canvas.height/2 + camera.y;
            if (pX > -currentCell && pX < canvas.width && pY > -currentCell && pY < canvas.height) {
                drawPiece(pX, pY, board[key], currentCell);
            }
        }
    }
    function drawPiece(x, y, type, size) {
        const p = size * 0.2;
        ctx.lineWidth = size * 0.12;
        ctx.lineCap = "round";
       
        if (type === "X") {
            ctx.strokeStyle = "#fff";
            ctx.shadowColor = "#fff"; ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.moveTo(x+p, y+p); ctx.lineTo(x+size-p, y+size-p);
            ctx.moveTo(x+size-p, y+p); ctx.lineTo(x+p, y+size-p);
            ctx.stroke();
        } else {
            ctx.strokeStyle = "#ff3838";
            ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(x+size/2, y+size/2, size/2-p, 0, Math.PI*2);
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }
    initGame();
</script>
</body>
</html>
