<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Caro Vô Cực - AI Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Included per requirements, though main game uses native Canvas -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Vietnamese:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Vietnamese', sans-serif; overflow: hidden; }
        /* Custom Scrollbar for side panels if needed */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        #gameCanvas {
            cursor: crosshair;
            touch-action: none; /* Prevent scrolling on mobile while playing */
            background-color: #f0ebe3; /* Paper/Wood tone */
            background-image: radial-gradient(#d6d3cd 1px, transparent 1px);
            background-size: 40px 40px; /* Fallback pattern */
        }
    </style>
    <!-- Chosen Palette: Warm Neutrals (Paper/Wood) with Ink Blue (X) and Alert Red (O) -->
    <!-- Application Structure Plan: 
         1. Main Viewport: Full-screen HTML5 Canvas for the infinite board.
         2. Floating Dashboard: Top header for score and game controls (Reset, Difficulty).
         3. Status Overlay: Non-intrusive notifications for turn state and win/loss.
         4. Interaction Design: Pan (drag) and Zoom (scroll) support for infinite feel. Click to place.
    -->
    <!-- Visualization & Content Choices:
         - Game Board: Rendered via Canvas API for performance (No SVG).
         - UI Elements: Tailwind Grid/Flex for layout.
         - Logic: Minimax with Alpha-Beta pruning for AI.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
</head>
<body class="bg-stone-100 h-screen w-screen flex flex-col relative text-stone-800">

    <!-- Header / Control Panel -->
    <header class="absolute top-0 left-0 right-0 z-20 p-4 pointer-events-none">
        <div class="max-w-4xl mx-auto flex justify-between items-center glass-panel rounded-2xl p-3 pointer-events-auto transition-all shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md">X</div>
                <div class="hidden sm:block">
                    <h1 class="font-bold text-lg leading-tight">Cờ Caro Vô Cực</h1>
                    <p class="text-xs text-stone-500">Người vs AI Master</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Difficulty Toggle -->
                <div class="flex bg-stone-200 rounded-lg p-1">
                    <button id="btnEasy" class="px-3 py-1 rounded-md text-sm font-medium transition-colors" onclick="setDifficulty('easy')">Dễ</button>
                    <button id="btnHard" class="px-3 py-1 rounded-md text-sm font-medium bg-white shadow-sm text-blue-700 transition-colors" onclick="setDifficulty('hard')">Khó (AI)</button>
                </div>

                <!-- Reset Button -->
                <button onclick="resetGame()" class="bg-stone-800 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md transition-transform active:scale-95 flex items-center gap-2">
                    <span>Ván Mới</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Game Status Notification -->
    <div id="statusMessage" class="absolute top-24 left-1/2 transform -translate-x-1/2 z-10 pointer-events-none opacity-0 transition-opacity duration-300">
        <div class="glass-panel px-6 py-2 rounded-full font-bold text-stone-700 shadow-xl border-l-4 border-blue-500">
            Đến lượt bạn (X)
        </div>
    </div>

    <!-- Main Game Canvas -->
    <main class="flex-grow w-full h-full relative overflow-hidden cursor-move">
        <canvas id="gameCanvas" class="block w-full h-full"></canvas>
        
        <!-- Hint/Instruction Overlay (Bottom) -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 pointer-events-none opacity-70 hover:opacity-100 transition-opacity">
            <p class="text-xs sm:text-sm font-medium text-stone-500 bg-white/80 px-3 py-1 rounded-full shadow-sm backdrop-blur-sm">
                Kéo chuột để di chuyển bàn cờ • Click để đánh • 5 ô liên tiếp để thắng
            </p>
        </div>
    </main>

    <!-- Game Over Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center transform scale-95 opacity-0 transition-all duration-300" id="modalContent">
            <div id="modalIcon" class="text-6xl mb-4">🏆</div>
            <h2 id="modalTitle" class="text-2xl font-bold mb-2 text-stone-800">Chiến Thắng!</h2>
            <p id="modalDesc" class="text-stone-600 mb-6">Bạn đã đánh bại AI. Một ván đấu tuyệt vời.</p>
            <button onclick="closeModalAndReset()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform active:scale-95">
                Chơi Lại Ngay
            </button>
        </div>
    </div>

    <script>
        // --- CONSTANTS & STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('statusMessage');
        const modal = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        
        const CELL_SIZE = 40;
        const GRID_COLOR = '#d1d5db'; // gray-300
        const PLAYER_X = 1; // Human
        const PLAYER_O = 2; // AI
        
        // Game State
        let board = new Map(); // Key: "x,y", Value: 1 or 2
        let history = []; // Stack for undo (not implemented in UI but good for logic)
        let isGameOver = false;
        let isPlayerTurn = true;
        let difficulty = 'hard';
        
        // Viewport State (Infinite Board Logic)
        let camera = { x: 0, y: 0 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let dragStart = { x: 0, y: 0 };

        // --- INITIALIZATION ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Center the "0,0" coordinate initially
            camera.x = canvas.width / 2;
            camera.y = canvas.height / 2;
            draw();
        }
        window.addEventListener('resize', resize);

        // --- GAME LOGIC ---

        function getKey(x, y) { return `${x},${y}`; }
        function parseKey(key) { return key.split(',').map(Number); }

        function getCell(x, y) {
            return board.get(getKey(x, y)) || 0;
        }

        function setCell(x, y, player) {
            board.set(getKey(x, y), player);
            history.push({x, y, player});
        }

        // Check for 5 in a row
        function checkWin(x, y, player) {
            const directions = [
                [1, 0],  // Horizontal
                [0, 1],  // Vertical
                [1, 1],  // Diagonal \
                [1, -1]  // Diagonal /
            ];

            for (let [dx, dy] of directions) {
                let count = 1;
                // Check forward
                for (let i = 1; i < 5; i++) {
                    if (getCell(x + dx * i, y + dy * i) === player) count++;
                    else break;
                }
                // Check backward
                for (let i = 1; i < 5; i++) {
                    if (getCell(x - dx * i, y - dy * i) === player) count++;
                    else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        // --- AI LOGIC (MiniMax + Heuristics) ---
        // Simplified threat evaluation for performance in JS
        
        function getCandidates(padding = 2) {
            const candidates = new Set();
            for (let key of board.keys()) {
                const [cx, cy] = parseKey(key);
                for (let dx = -padding; dx <= padding; dx++) {
                    for (let dy = -padding; dy <= padding; dy++) {
                        if (dx === 0 && dy === 0) continue;
                        if (!board.has(getKey(cx + dx, cy + dy))) {
                            candidates.add(getKey(cx + dx, cy + dy));
                        }
                    }
                }
            }
            // If board is empty, return center
            if (candidates.size === 0) return [getKey(0, 0)];
            return Array.from(candidates);
        }

        function evaluateBoard(player) {
            // This is a simplified evaluation. 
            // Real Gomoku AIs look for specific patterns (Open 4, Closed 4, Open 3, etc.)
            // We will simulate this by scoring patterns.
            let score = 0;
            const opponent = player === PLAYER_X ? PLAYER_O : PLAYER_X;
            
            // Scan board directions for patterns
            // Note: Full board scan is slow. We only scan lines involved in moves usually.
            // Here we use a simpler approach: Evaluate score of a specific move relative to existing board.
            return 0; 
        }

        function evaluatePosition(x, y, player) {
            let score = 0;
            const opponent = player === PLAYER_O ? PLAYER_X : PLAYER_O;
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (let [dx, dy] of directions) {
                // Analyze the line passing through x,y
                let myLine = 1; // Consec stones including current
                let openEnds = 0;
                let blocked = false;
                
                // Forward
                let i = 1;
                while (getCell(x + dx * i, y + dy * i) === player && i < 5) { myLine++; i++; }
                if (getCell(x + dx * i, y + dy * i) === 0) openEnds++;
                
                // Backward
                let j = 1;
                while (getCell(x - dx * j, y - dy * j) === player && j < 5) { myLine++; j++; }
                if (getCell(x - dx * j, y - dy * j) === 0) openEnds++;

                // Scoring (Aggressive/Defensive Mix)
                if (myLine >= 5) score += 100000;
                else if (myLine === 4 && openEnds > 0) score += 10000; // Winning next turn
                else if (myLine === 3 && openEnds === 2) score += 5000; // Strong threat
                else if (myLine === 3 && openEnds === 1) score += 1000;
                else if (myLine === 2 && openEnds === 2) score += 500;
                else if (myLine === 2 && openEnds === 1) score += 100;
            }
            return score;
        }

        function getBestMove() {
            // 1. Get candidate moves (empty cells adjacent to filled cells)
            const candidates = getCandidates();
            let bestScore = -Infinity;
            let bestMove = null;
            
            // If first move, play near center 0,0 usually, but here just random or 0,0
            if (board.size === 0) return {x: 0, y: 0};

            // Heuristic Search (Depth 1 with heavy pattern weighting)
            // Ideally we'd use Alpha-Beta, but JS single-thread can lag with infinite board candidates.
            // We use a "Greedy" approach with Defense priority for "Hard" mode.
            
            for (let key of candidates) {
                const [x, y] = parseKey(key);
                
                // Score for AI (Attack)
                const attackScore = evaluatePosition(x, y, PLAYER_O);
                
                // Score for Human (Defense - how good is this spot for human?)
                const defenseScore = evaluatePosition(x, y, PLAYER_X);
                
                let totalScore = 0;
                
                if (difficulty === 'hard') {
                    // In Hard mode, we prioritize blocking high threats
                    // If opponent has a winning move (high defense score), we MUST block it implies 
                    // this cell has high value.
                    // We give slightly more weight to Attack if we can win immediately.
                    
                    if (attackScore >= 100000) totalScore = 200000; // Win now
                    else if (defenseScore >= 100000) totalScore = 150000; // Block immediate loss
                    else if (attackScore >= 10000) totalScore = attackScore + defenseScore * 0.8;
                    else if (defenseScore >= 10000) totalScore = defenseScore + attackScore * 0.5; // Block 4
                    else totalScore = attackScore + defenseScore;
                } else {
                    // Easy mode: Mostly random with slight bias to attack
                    totalScore = attackScore + Math.random() * 200;
                }

                if (totalScore > bestScore) {
                    bestScore = totalScore;
                    bestMove = {x, y};
                }
            }
            
            return bestMove;
        }

        async function playAI() {
            if (isGameOver) return;
            
            showStatus("AI đang nghĩ...", "blue");
            
            // Small delay for realism and UI update
            setTimeout(() => {
                const move = getBestMove();
                if (move) {
                    makeMove(move.x, move.y, PLAYER_O);
                }
            }, 300);
        }

        // --- CORE INTERACTION ---

        function makeMove(x, y, player) {
            if (getCell(x, y) !== 0 || isGameOver) return;

            setCell(x, y, player);
            draw();

            // Check Win
            if (checkWin(x, y, player)) {
                endGame(player);
                return;
            }

            // Switch Turn
            isPlayerTurn = !isPlayerTurn;
            
            if (isPlayerTurn) {
                showStatus("Đến lượt bạn (X)", "stone");
            } else {
                playAI();
            }
        }

        function endGame(winner) {
            isGameOver = true;
            draw(); // Draw final state
            
            const title = winner === PLAYER_X ? "Bạn Đã Thắng! 🎉" : "AI Đã Thắng 🤖";
            const desc = winner === PLAYER_X ? "Trí tuệ siêu phàm! Bạn đã đánh bại máy." : "Đừng buồn, hãy thử lại chiến thuật mới.";
            const icon = winner === PLAYER_X ? "🏆" : "💀";
            
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('modalIcon').textContent = icon;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModalAndReset() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                resetGame();
            }, 300);
        }

        function resetGame() {
            board.clear();
            history = [];
            isGameOver = false;
            isPlayerTurn = true;
            // Recenter
            camera.x = canvas.width / 2;
            camera.y = canvas.height / 2;
            showStatus("Ván mới bắt đầu!", "green");
            setTimeout(() => showStatus("Đến lượt bạn (X)", "stone"), 1500);
            draw();
        }

        function setDifficulty(level) {
            difficulty = level;
            document.getElementById('btnEasy').className = level === 'easy' ? "px-3 py-1 rounded-md text-sm font-medium bg-white shadow-sm text-blue-700 transition-colors" : "px-3 py-1 rounded-md text-sm font-medium transition-colors";
            document.getElementById('btnHard').className = level === 'hard' ? "px-3 py-1 rounded-md text-sm font-medium bg-white shadow-sm text-blue-700 transition-colors" : "px-3 py-1 rounded-md text-sm font-medium transition-colors";
            
            // If switching mid-game and it's AI turn, reset AI thought process technically
            // But simple toggle is fine.
        }

        function showStatus(msg, colorType) {
            statusEl.classList.remove('opacity-0');
            const inner = statusEl.firstElementChild;
            inner.textContent = msg;
            
            // Colors
            if(colorType === 'blue') inner.className = "glass-panel px-6 py-2 rounded-full font-bold text-blue-700 shadow-xl border-l-4 border-blue-500";
            else if(colorType === 'green') inner.className = "glass-panel px-6 py-2 rounded-full font-bold text-green-700 shadow-xl border-l-4 border-green-500";
            else inner.className = "glass-panel px-6 py-2 rounded-full font-bold text-stone-700 shadow-xl border-l-4 border-stone-500";

            // Auto hide after delay unless it's AI thinking
            if(colorType !== 'blue') {
                // setTimeout(() => statusEl.classList.add('opacity-0'), 3000);
            }
        }

        // --- RENDERING (CANVAS) ---

        function draw() {
            // 1. Clear Background
            ctx.fillStyle = '#f0ebe3'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Calculate Grid Visible Range
            // Camera (x,y) is the center of the screen
            const startX = Math.floor((camera.x - canvas.width / 2) / CELL_SIZE) - 1;
            const endX = Math.floor((camera.x + canvas.width / 2) / CELL_SIZE) + 1;
            const startY = Math.floor((camera.y - canvas.height / 2) / CELL_SIZE) - 1;
            const endY = Math.floor((camera.y + canvas.height / 2) / CELL_SIZE) + 1;

            const offsetX = canvas.width / 2 - camera.x;
            const offsetY = canvas.height / 2 - camera.y;

            // 3. Draw Grid Lines
            ctx.beginPath();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#d6d3cd'; // Slightly darker than bg

            for (let x = startX; x <= endX; x++) {
                const px = x * CELL_SIZE + offsetX;
                ctx.moveTo(px, 0);
                ctx.lineTo(px, canvas.height);
            }
            for (let y = startY; y <= endY; y++) {
                const py = y * CELL_SIZE + offsetY;
                ctx.moveTo(0, py);
                ctx.lineTo(canvas.width, py);
            }
            ctx.stroke();

            // Highlight Center (0,0) for reference
            ctx.fillStyle = '#a8a29e';
            ctx.beginPath();
            ctx.arc(0 * CELL_SIZE + offsetX, 0 * CELL_SIZE + offsetY, 3, 0, Math.PI * 2);
            ctx.fill();

            // 4. Draw Stones (Only visible ones usually, but iterating map is fast enough for <1000 moves)
            for (let [key, player] of board) {
                const [gx, gy] = parseKey(key);
                const px = gx * CELL_SIZE + offsetX;
                const py = gy * CELL_SIZE + offsetY;

                // Optimization: Skip if off screen
                if (px < -CELL_SIZE || px > canvas.width + CELL_SIZE || py < -CELL_SIZE || py > canvas.height + CELL_SIZE) continue;

                drawStone(px, py, player, gx, gy);
            }

            // 5. Highlight Last Move
            if (history.length > 0) {
                const last = history[history.length - 1];
                const px = last.x * CELL_SIZE + offsetX;
                const py = last.y * CELL_SIZE + offsetY;
                
                ctx.strokeStyle = last.player === PLAYER_X ? 'rgba(37, 99, 235, 0.4)' : 'rgba(220, 38, 38, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, CELL_SIZE * 0.45, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawStone(x, y, player, gx, gy) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 2;

            if (player === PLAYER_X) {
                // Draw X
                ctx.strokeStyle = '#2563eb'; // Blue 600
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                const size = CELL_SIZE * 0.3;
                ctx.beginPath();
                ctx.moveTo(x - size, y - size);
                ctx.lineTo(x + size, y + size);
                ctx.moveTo(x + size, y - size);
                ctx.lineTo(x - size, y + size);
                ctx.stroke();
            } else {
                // Draw O
                ctx.strokeStyle = '#dc2626'; // Red 600
                ctx.lineWidth = 3;
                
                const r = CELL_SIZE * 0.3;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.shadowColor = 'transparent'; // Reset shadow
        }

        // --- INPUT HANDLERS ---

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            // Handle both touch and mouse
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('touchstart', startDrag, {passive: false});

        canvas.addEventListener('mousemove', drag);
        canvas.addEventListener('touchmove', drag, {passive: false});

        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('touchend', endDrag);

        function startDrag(e) {
            if (e.type === 'touchstart') e.preventDefault(); // Prevent scroll
            isDragging = false; // Optimistic, assumes click first
            const pos = getMousePos(e);
            lastMouse = pos;
            dragStart = pos;
        }

        function drag(e) {
            if (e.buttons !== 1 && e.type !== 'touchmove') return;
            const pos = getMousePos(e);
            
            // Calculate delta
            const dx = pos.x - lastMouse.x;
            const dy = pos.y - lastMouse.y;
            
            // If moved significantly, treat as drag
            if (Math.abs(pos.x - dragStart.x) > 5 || Math.abs(pos.y - dragStart.y) > 5) {
                isDragging = true;
                canvas.style.cursor = 'grabbing';
                camera.x -= dx;
                camera.y -= dy;
                draw();
            }
            lastMouse = pos;
        }

        function endDrag(e) {
            canvas.style.cursor = 'crosshair';
            
            if (!isDragging) {
                // It was a click
                if (!isPlayerTurn || isGameOver) return;
                
                const offsetX = canvas.width / 2 - camera.x;
                const offsetY = canvas.height / 2 - camera.y;
                
                // Use dragStart (mouse down position) for accuracy
                // Calculate grid coordinates relative to screen center offset
                // Current pixel = grid * cell + offset
                // grid * cell = pixel - offset
                // grid = (pixel - offset) / cell
                
                // Need to use current mouse pos for click? No, use lastMouse from mouseup or dragStart
                // Better: Use the position where mouse went UP if it wasn't a drag.
                
                // Let's re-calculate click pos
                // Note: 'e' in mouseup might not have coords in some browsers, use lastMouse
                // But lastMouse is updated in drag/mousedown.
                
                const clickX = Math.round((lastMouse.x - offsetX) / CELL_SIZE);
                const clickY = Math.round((lastMouse.y - offsetY) / CELL_SIZE);
                
                // Visual check: did we click near a grid intersection?
                // The math above rounds to nearest integer intersection.
                
                makeMove(clickX, clickY, PLAYER_X);
            }
            isDragging = false;
        }

        // Start
        resize();
        resetGame();
        setDifficulty('hard'); // Default to hard per prompt

    </script>
</body>
</html>
