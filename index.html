<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caro AI - Extreme Edition</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #121212; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.98);
            padding: 22px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            pointer-events: none; width: 260px; border-left: 5px solid #e74c3c;
        }
        h2 { margin: 0 0 5px 0; font-size: 1.4rem; color: #1a1a1a; }
        .difficulty { font-size: 0.7rem; color: #e74c3c; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        #status { margin-top: 15px; font-size: 1rem; color: #333; }
        .turn-x { color: #e74c3c; font-weight: bold; }
        .turn-o { color: #3498db; font-weight: bold; }
        .info { font-size: 0.85rem; color: #666; line-height: 1.6; margin-top: 15px; }
        #reset { 
            margin-top: 20px; pointer-events: auto; cursor: pointer;
            background: #1a1a1a; color: white; border: none; padding: 12px; 
            border-radius: 8px; width: 100%; font-weight: bold; transition: 0.2s;
        }
        #reset:hover { background: #333; transform: translateY(-2px); }
    </style>
</head>
<body>

<div id="ui">
    <div class="difficulty">Master Mode (Alpha-Beta)</div>
    <h2>Caro Ultra AI</h2>
    <div id="status">Lượt của: <span class="turn-x">Bạn (X)</span></div>
    
    <div class="info">
        • <b>Trạng thái:</b> Đang bật tính toán sâu<br>
        • <b>AI:</b> Sẽ ưu tiên chặn nước đôi<br>
        • <b>Kéo:</b> Chuột phải hoặc giữ để di chuyển<br>
        • <b>Cuộn:</b> Phóng to/Thu nhỏ
    </div>
    <button id="reset" onclick="resetGame()">VÁN MỚI</button>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let board = {}; 
    let turn = "X";
    let gameOver = false;
    let lastMove = null; 
    let camera = { x: 0, y: 0, zoom: 1 };
    let isDragging = false;
    let lastMousePos = { x: 0, y: 0 };
    const cellSize = 40;
    
    // ĐỘ KHÓ: 3 là cân bằng, 4 là rất khó (có thể gây lag nhẹ khi bắt đầu ván)
    const AI_DEPTH = 3; 

    function init() {
        window.addEventListener('resize', resize);
        resize();
        canvas.addEventListener('mousedown', (e) => { isDragging = false; lastMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (e.buttons === 1 || e.buttons === 2) {
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    isDragging = true;
                    camera.x += dx; camera.y += dy;
                    lastMousePos = { x: e.clientX, y: e.clientY };
                }
            }
        });
        canvas.addEventListener('wheel', (e) => {
            const zoomSpeed = 0.1;
            camera.zoom *= (e.deltaY > 0 ? (1 - zoomSpeed) : (1 + zoomSpeed));
            camera.zoom = Math.min(Math.max(camera.zoom, 0.3), 2.5);
        });
        canvas.addEventListener('click', handleClick);
        render();
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    function screenToWorld(sx, sy) {
        const x = Math.floor((sx - canvas.width/2 - camera.x) / (cellSize * camera.zoom));
        const y = Math.floor((sy - canvas.height/2 - camera.y) / (cellSize * camera.zoom));
        return { x, y };
    }

    function handleClick(e) {
        if (isDragging || gameOver || turn === "O") return;
        const pos = screenToWorld(e.clientX, e.clientY);
        if (!board[`${pos.x},${pos.y}`]) {
            makeMove(pos.x, pos.y, "X");
            if (!gameOver) {
                statusEl.innerHTML = `AI đang tính toán...`;
                setTimeout(aiMove, 100); 
            }
        }
    }

    function makeMove(x, y, p) {
        board[`${x},${y}`] = p;
        lastMove = { x, y };
        if (checkWin(x, y, p)) {
            statusEl.innerHTML = p === "X" ? "<span class='turn-x'>BẠN THẮNG!</span>" : "<span class='turn-o'>MÁY THẮNG!</span>";
            gameOver = true;
        } else {
            turn = p === "X" ? "O" : "X";
            statusEl.innerHTML = `Lượt của: <span class="turn-${turn.toLowerCase()}">${turn === "X" ? "Bạn (X)" : "Máy (O)"}</span>`;
        }
    }

    function aiMove() {
        if (gameOver) return;
        let bestScore = -Infinity;
        let move = null;
        let candidates = getCandidates();

        if (candidates.length === 0) {
            makeMove(0, 0, "O");
            return;
        }

        // Ưu tiên nước đi thắng ngay lập tức
        for (let cand of candidates) {
            if (checkWin(cand.x, cand.y, "O")) {
                makeMove(cand.x, cand.y, "O");
                return;
            }
        }

        // Thuật toán Minimax với Alpha-Beta Pruning
        for (let cand of candidates) {
            board[`${cand.x},${cand.y}`] = "O";
            let score = minimax(AI_DEPTH - 1, -Infinity, Infinity, false);
            delete board[`${cand.x},${cand.y}`];
            if (score > bestScore) {
                bestScore = score;
                move = cand;
            }
        }
        if (move) makeMove(move.x, move.y, "O");
    }

    function minimax(depth, alpha, beta, isMaximizing) {
        if (depth === 0) return evaluateBoard();

        let candidates = getCandidates();
        if (isMaximizing) {
            let maxEval = -Infinity;
            for (let cand of candidates) {
                board[`${cand.x},${cand.y}`] = "O";
                let ev = minimax(depth - 1, alpha, beta, false);
                delete board[`${cand.x},${cand.y}`];
                maxEval = Math.max(maxEval, ev);
                alpha = Math.max(alpha, ev);
                if (beta <= alpha) break;
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (let cand of candidates) {
                board[`${cand.x},${cand.y}`] = "X";
                let ev = minimax(depth - 1, alpha, beta, true);
                delete board[`${cand.x},${cand.y}`];
                minEval = Math.min(minEval, ev);
                beta = Math.min(beta, ev);
                if (beta <= alpha) break;
            }
            return minEval;
        }
    }

    function getCandidates() {
        let coords = new Set();
        let range = 1; // Chỉ xét ô trống xung quanh quân đã đánh 1 ô để tối ưu
        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            for (let i = -range; i <= range; i++) {
                for (let j = -range; j <= range; j++) {
                    let k = `${x + i},${y + j}`;
                    if (!board[k]) coords.add(k);
                }
            }
        }
        return Array.from(coords).map(k => {
            let [x, y] = k.split(',').map(Number);
            return { x, y };
        });
    }

    function evaluateBoard() {
        let score = 0;
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        
        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            let p = board[key];
            let cellScore = 0;

            for (let [dx, dy] of dirs) {
                let {c, b1, b2} = countDetailed(x, y, dx, dy, p);
                
                if (c >= 5) cellScore += 1000000;
                else if (c === 4) {
                    if (!b1 && !b2) cellScore += 50000; // 4 hở 2 đầu
                    else if (!b1 || !b2) cellScore += 5000; // 4 bị chặn 1 đầu
                }
                else if (c === 3) {
                    if (!b1 && !b2) cellScore += 3000; // 3 hở 2 đầu
                    else if (!b1 || !b2) cellScore += 500;
                }
                else if (c === 2) {
                    if (!b1 && !b2) cellScore += 200;
                }
            }
            // AI (O) cộng điểm, Người (X) trừ điểm (và ưu tiên chặn X hơn)
            score += (p === "O" ? cellScore : -cellScore * 1.5);
        }
        return score;
    }

    function countDetailed(x, y, dx, dy, p) {
        let c = 1, nx = x + dx, ny = y + dy;
        while (board[`${nx},${ny}`] === p) { c++; nx += dx; ny += dy; }
        let b1 = board[`${nx},${ny}`] !== undefined && board[`${nx},${ny}`] !== p;
        
        nx = x - dx; ny = y - dy;
        while (board[`${nx},${ny}`] === p) { c++; nx -= dx; ny -= dy; }
        let b2 = board[`${nx},${ny}`] !== undefined && board[`${nx},${ny}`] !== p;
        
        return {c, b1, b2};
    }

    function checkWin(x, y, p) {
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        for (let [dx, dy] of dirs) {
            if (countDetailed(x, y, dx, dy, p).c >= 5) return true;
        }
        return false;
    }

    function render() {
        ctx.fillStyle = "#121212";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const currentCell = cellSize * camera.zoom;
        const offX = (canvas.width/2 + camera.x) % currentCell;
        const offY = (canvas.height/2 + camera.y) % currentCell;

        // Vẽ lưới
        ctx.beginPath(); ctx.strokeStyle = "#222"; ctx.lineWidth = 1;
        for (let x = offX; x < canvas.width; x += currentCell) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
        for (let y = offY; y < canvas.height; y += currentCell) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
        ctx.stroke();

        // Highlight nước mới nhất
        if (lastMove) {
            const lx = lastMove.x * currentCell + canvas.width/2 + camera.x;
            const ly = lastMove.y * currentCell + canvas.height/2 + camera.y;
            ctx.fillStyle = "rgba(231, 76, 60, 0.2)";
            ctx.fillRect(lx, ly, currentCell, currentCell);
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.strokeRect(lx, ly, currentCell, currentCell);
        }

        // Vẽ quân cờ
        for (let key in board) {
            const [bx, by] = key.split(',').map(Number);
            const pX = bx * currentCell + canvas.width/2 + camera.x;
            const pY = by * currentCell + canvas.height/2 + camera.y;
            if (pX + currentCell > 0 && pX < canvas.width && pY + currentCell > 0 && pY < canvas.height) {
                drawPiece(pX, pY, board[key], currentCell);
            }
        }
        requestAnimationFrame(render);
    }

    function drawPiece(x, y, type, size) {
        ctx.lineWidth = size * 0.15;
        ctx.lineCap = "round";
        const p = size * 0.25;
        ctx.strokeStyle = type === "X" ? "#ff5e57" : "#48dbfb";
        ctx.beginPath();
        if (type === "X") {
            ctx.moveTo(x+p, y+p); ctx.lineTo(x+size-p, y+size-p);
            ctx.moveTo(x+size-p, y+p); ctx.lineTo(x+p, y+size-p);
        } else {
            ctx.arc(x+size/2, y+size/2, size/2-p, 0, Math.PI*2);
        }
        ctx.stroke();
    }

    function resetGame() {
        board = {}; turn = "X"; gameOver = false; lastMove = null;
        statusEl.innerHTML = `Lượt của: <span class="turn-x">Bạn (X)</span>`;
    }

    init();
</script>
</body>
</html>
