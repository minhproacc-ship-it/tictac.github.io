<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caro AI - Extreme Edition (Optimized)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #0f172a; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; cursor: crosshair; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(30, 41, 59, 0.95);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            pointer-events: none; width: 280px;
            border: 1px solid #334155;
            color: #e2e8f0;
            backdrop-filter: blur(5px);
        }
        h2 { margin: 0 0 10px 0; font-size: 1.5rem; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .difficulty { font-size: 0.75rem; color: #f43f5e; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        #status { margin-top: 15px; font-size: 1.1rem; font-weight: 600; }
        .turn-x { color: #f43f5e; } /* Đỏ hồng */
        .turn-o { color: #38bdf8; } /* Xanh dương sáng */
        .info { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px; }
        #reset { 
            margin-top: 20px; pointer-events: auto; cursor: pointer;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; border: none; padding: 12px; 
            border-radius: 6px; width: 100%; font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s;
        }
        #reset:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(37, 99, 235, 0.4); }
        #reset:active { transform: translateY(0); }
    </style>
</head>
<body>

<div id="ui">
    <div class="difficulty">Extreme Mode (Depth 4+)</div>
    <h2>Caro AI God-Tier</h2>
    <div id="status">Lượt của: <span class="turn-x">Bạn (X)</span></div>
    
    <div class="info">
        • <b>Thuật toán:</b> Minimax + Alpha-Beta + Move Sorting<br>
        • <b>Chiến thuật:</b> Tấn công dồn dập & Bẫy nước đôi<br>
        • <b>Điều khiển:</b> Kéo chuột phải để di chuyển map<br>
    </div>
    <button id="reset" onclick="resetGame()">VÁN MỚI</button>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let board = {}; 
    let turn = "X"; // Người chơi đi trước
    let gameOver = false;
    let lastMove = null; 
    let camera = { x: 0, y: 0, zoom: 1 };
    let isDragging = false;
    let lastMousePos = { x: 0, y: 0 };
    const cellSize = 40;
    
    // CẤU HÌNH AI
    const AI_DEPTH = 4; // Độ sâu tính toán (4 là rất mạnh với JS)
    const MAX_WIDTH = 20; // Giới hạn phạm vi tìm kiếm cục bộ để tối ưu tốc độ

    // Bảng điểm đánh giá thế cờ (Score Table)
    const SCORE = {
        WIN: 100000000,
        OPEN_4: 10000000,   // OOOO_
        BLOCKED_4: 1000000, // OOOOX
        OPEN_3: 100000,     // _OOO_
        BLOCKED_3: 1000,    // _OOOX
        OPEN_2: 100,
        BLOCKED_2: 10
    };

    function init() {
        window.addEventListener('resize', resize);
        resize();
        canvas.addEventListener('mousedown', (e) => { isDragging = false; lastMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (e.buttons === 1 || e.buttons === 2) {
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    isDragging = true;
                    camera.x += dx; camera.y += dy;
                    lastMousePos = { x: e.clientX, y: e.clientY };
                }
            }
        });
        canvas.addEventListener('wheel', (e) => {
            const zoomSpeed = 0.1;
            camera.zoom *= (e.deltaY > 0 ? (1 - zoomSpeed) : (1 + zoomSpeed));
            camera.zoom = Math.min(Math.max(camera.zoom, 0.4), 2.0);
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault()); // Chặn menu chuột phải
        canvas.addEventListener('click', handleClick);
        render();
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    function screenToWorld(sx, sy) {
        const x = Math.floor((sx - canvas.width/2 - camera.x) / (cellSize * camera.zoom));
        const y = Math.floor((sy - canvas.height/2 - camera.y) / (cellSize * camera.zoom));
        return { x, y };
    }

    function handleClick(e) {
        if (isDragging || gameOver || turn === "O") return;
        const pos = screenToWorld(e.clientX, e.clientY);
        if (!board[`${pos.x},${pos.y}`]) {
            makeMove(pos.x, pos.y, "X");
            if (!gameOver) {
                statusEl.innerHTML = `AI đang suy nghĩ...`;
                // Sử dụng setTimeout để UI kịp cập nhật trước khi AI chiếm thread
                setTimeout(aiMove, 20); 
            }
        }
    }

    function makeMove(x, y, p) {
        board[`${x},${y}`] = p;
        lastMove = { x, y };
        // Chỉ check thắng thua cục bộ tại điểm vừa đánh để nhanh hơn
        if (checkWin(x, y, p)) {
            statusEl.innerHTML = p === "X" ? "<span class='turn-x'>BẠN ĐÃ THẮNG!</span>" : "<span class='turn-o'>AI ĐÃ THẮNG!</span>";
            gameOver = true;
        } else {
            turn = p === "X" ? "O" : "X";
            statusEl.innerHTML = `Lượt của: <span class="turn-${turn.toLowerCase()}">${turn === "X" ? "Bạn (X)" : "Máy (O)"}</span>`;
        }
    }

    // --- AI LOGIC CORE ---

    function aiMove() {
        if (gameOver) return;

        // 1. Kiểm tra các nước thắng ngay lập tức hoặc buộc phải đỡ (Chiến thuật tham lam)
        const criticalMove = findCriticalMove();
        if (criticalMove) {
            makeMove(criticalMove.x, criticalMove.y, "O");
            return;
        }

        // 2. Nếu không có nước khẩn cấp, chạy Minimax
        let candidates = getCandidates(1); // Lấy các ô trống xung quanh ô có đánh (bán kính 1)
        
        // Nếu bàn cờ trống, đánh vào tâm (0,0)
        if (candidates.length === 0) {
            makeMove(0, 0, "O");
            return;
        }

        let bestScore = -Infinity;
        let bestMove = candidates[0];
        let alpha = -Infinity;
        let beta = Infinity;

        // Duyệt qua các nước đi tiềm năng
        for (let move of candidates) {
            board[`${move.x},${move.y}`] = "O";
            // Gọi minimax
            let score = minimax(AI_DEPTH - 1, alpha, beta, false);
            delete board[`${move.x},${move.y}`];

            if (score > bestScore) {
                bestScore = score;
                bestMove = move;
            }
            alpha = Math.max(alpha, score);
            // Không break ở đây vì đây là root node, cần tìm move tốt nhất
        }

        makeMove(bestMove.x, bestMove.y, "O");
    }

    // Tìm các nước đi "Bắt buộc": Thắng ngay hoặc Chặn thua ngay
    function findCriticalMove() {
        let candidates = getCandidates(2); // Quét rộng hơn một chút cho các nước đe dọa
        
        // Check: AI có thể thắng ngay không?
        for (let m of candidates) {
            board[`${m.x},${m.y}`] = "O";
            if (checkWin(m.x, m.y, "O")) {
                delete board[`${m.x},${m.y}`];
                return m;
            }
            delete board[`${m.x},${m.y}`];
        }

        // Check: Người chơi có thể thắng ngay không? (Phải chặn)
        for (let m of candidates) {
            board[`${m.x},${m.y}`] = "X";
            if (checkWin(m.x, m.y, "X")) {
                delete board[`${m.x},${m.y}`];
                return m;
            }
            delete board[`${m.x},${m.y}`];
        }
        return null;
    }

    function minimax(depth, alpha, beta, isMaximizing) {
        if (depth === 0) return evaluateBoard();

        let candidates = getCandidates(1);
        
        // Nếu không còn nước đi
        if (candidates.length === 0) return evaluateBoard();

        if (isMaximizing) { // Lượt AI (O)
            let maxEval = -Infinity;
            for (let move of candidates) {
                board[`${move.x},${move.y}`] = "O";
                // Kiểm tra thắng sớm để cắt tỉa
                if (checkWin(move.x, move.y, "O")) {
                    delete board[`${move.x},${move.y}`];
                    return SCORE.WIN; 
                }
                
                let eval = minimax(depth - 1, alpha, beta, false);
                delete board[`${move.x},${move.y}`];
                
                maxEval = Math.max(maxEval, eval);
                alpha = Math.max(alpha, eval);
                if (beta <= alpha) break;
            }
            return maxEval;
        } else { // Lượt Người (X)
            let minEval = Infinity;
            for (let move of candidates) {
                board[`${move.x},${move.y}`] = "X";
                 // Kiểm tra thắng sớm
                if (checkWin(move.x, move.y, "X")) {
                    delete board[`${move.x},${move.y}`];
                    return -SCORE.WIN; 
                }

                let eval = minimax(depth - 1, alpha, beta, true);
                delete board[`${move.x},${move.y}`];
                
                minEval = Math.min(minEval, eval);
                beta = Math.min(beta, eval);
                if (beta <= alpha) break;
            }
            return minEval;
        }
    }

    // Lấy danh sách các ô trống xung quanh các quân đã đánh
    // Có Sắp xếp (Ordering) để Alpha-Beta hiệu quả hơn
    function getCandidates(range = 1) {
        let uniqueKeys = new Set();
        let candidates = [];
        
        // Chỉ xét các ô gần quân đã đánh
        for (let key in board) {
            let [cx, cy] = key.split(',').map(Number);
            for (let dx = -range; dx <= range; dx++) {
                for (let dy = -range; dy <= range; dy++) {
                    if (dx === 0 && dy === 0) continue;
                    let nx = cx + dx, ny = cy + dy;
                    let nKey = `${nx},${ny}`;
                    if (!board[nKey] && !uniqueKeys.has(nKey)) {
                        uniqueKeys.add(nKey);
                        candidates.push({x: nx, y: ny});
                    }
                }
            }
        }

        // Heuristic Sắp xếp: Ưu tiên ô gần trung tâm hoặc gần lastMove
        // Điều này giúp thuật toán tìm ra nhánh tốt sớm hơn -> Cắt tỉa nhiều hơn -> Nhanh hơn
        if (lastMove) {
            candidates.sort((a, b) => {
                let distA = Math.abs(a.x - lastMove.x) + Math.abs(a.y - lastMove.y);
                let distB = Math.abs(b.x - lastMove.x) + Math.abs(b.y - lastMove.y);
                return distA - distB;
            });
        }
        
        // Giới hạn số lượng candidate để tránh bùng nổ tổ hợp nếu bàn cờ quá đông
        // Chỉ lấy Top 20-30 nước khả dĩ nhất nếu ở độ sâu lớn
        if (candidates.length > 25) return candidates.slice(0, 25);
        return candidates;
    }

    // Hàm đánh giá thế cờ: Đây là "Bộ não" quyết định độ khôn
    function evaluateBoard() {
        let totalScore = 0;
        // Duyệt qua tất cả các chuỗi trên bàn cờ
        // Lưu ý: Để tối ưu tốc độ, ta có thể chỉ tính điểm các ô vừa thay đổi, 
        // nhưng ở đây ta tính toàn bộ để code đơn giản và chính xác hơn.
        
        let checked = new Set();
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];

        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            let p = board[key];
            
            for (let [dx, dy] of dirs) {
                // Chỉ duyệt theo hướng dương để tránh trùng lặp
                // Nếu ô trước đó cùng loại thì đã tính rồi, bỏ qua
                let prevKey = `${x-dx},${y-dy}`;
                if (board[prevKey] === p) continue;

                let count = 0;
                let blockedStart = false;
                let blockedEnd = false;
                
                // Kiểm tra chặn đầu
                if (board[prevKey] !== undefined) blockedStart = true; // Bị chặn bởi địch hoặc hết biên (coi như địch)

                let tx = x, ty = y;
                while(board[`${tx},${ty}`] === p) {
                    count++;
                    tx += dx; ty += dy;
                }
                
                // Kiểm tra chặn đuôi
                let nextKey = `${tx},${ty}`;
                if (board[nextKey] !== undefined) blockedEnd = true;

                let currentScore = 0;
                
                // Tính điểm dựa trên bảng SCORE
                if (count >= 5) currentScore = SCORE.WIN;
                else if (count === 4) {
                    if (!blockedStart && !blockedEnd) currentScore = SCORE.OPEN_4;
                    else if (!blockedStart || !blockedEnd) currentScore = SCORE.BLOCKED_4;
                } else if (count === 3) {
                    if (!blockedStart && !blockedEnd) currentScore = SCORE.OPEN_3;
                    else if (!blockedStart || !blockedEnd) currentScore = SCORE.BLOCKED_3;
                } else if (count === 2) {
                    if (!blockedStart && !blockedEnd) currentScore = SCORE.OPEN_2;
                    else if (!blockedStart || !blockedEnd) currentScore = SCORE.BLOCKED_2;
                }

                // AI (O) muốn Max điểm, Người (X) muốn Min điểm (với AI)
                // Hệ số 1.2 cho quân X để AI ưu tiên phòng thủ hơn một chút nếu thế cờ ngang bằng
                if (p === "O") totalScore += currentScore;
                else totalScore -= currentScore * 1.2; 
            }
        }
        return totalScore;
    }

    function checkWin(x, y, p) {
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        for (let [dx, dy] of dirs) {
            let count = 1;
            let i = 1;
            while (board[`${x + i*dx},${y + i*dy}`] === p) { count++; i++; }
            i = 1;
            while (board[`${x - i*dx},${y - i*dy}`] === p) { count++; i++; }
            if (count >= 5) return true;
        }
        return false;
    }

    // --- GRAPHICS ---
    function render() {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const currentCell = cellSize * camera.zoom;
        const offX = (canvas.width/2 + camera.x) % currentCell;
        const offY = (canvas.height/2 + camera.y) % currentCell;

        // Vẽ lưới mờ
        ctx.beginPath(); ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
        for (let x = offX; x < canvas.width; x += currentCell) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
        for (let y = offY; y < canvas.height; y += currentCell) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
        ctx.stroke();

        // Highlight nước đi cuối cùng
        if (lastMove) {
            const lx = lastMove.x * currentCell + canvas.width/2 + camera.x;
            const ly = lastMove.y * currentCell + canvas.height/2 + camera.y;
            // Hiệu ứng phát sáng
            const grd = ctx.createRadialGradient(lx+currentCell/2, ly+currentCell/2, 5, lx+currentCell/2, ly+currentCell/2, currentCell);
            grd.addColorStop(0, "rgba(255, 255, 255, 0.3)");
            grd.addColorStop(1, "rgba(255, 255, 255, 0)");
            ctx.fillStyle = grd;
            ctx.fillRect(lx - currentCell/2, ly - currentCell/2, currentCell*2, currentCell*2);
            
            ctx.strokeStyle = "#fbbf24"; // Vàng kim
            ctx.lineWidth = 2;
            ctx.strokeRect(lx, ly, currentCell, currentCell);
        }

        // Vẽ quân cờ
        for (let key in board) {
            const [bx, by] = key.split(',').map(Number);
            const pX = bx * currentCell + canvas.width/2 + camera.x;
            const pY = by * currentCell + canvas.height/2 + camera.y;
            
            // Chỉ vẽ những quân trong màn hình
            if (pX + currentCell > -50 && pX < canvas.width + 50 && pY + currentCell > -50 && pY < canvas.height + 50) {
                drawPiece(pX, pY, board[key], currentCell);
            }
        }
        requestAnimationFrame(render);
    }

    function drawPiece(x, y, type, size) {
        ctx.lineWidth = size * 0.12;
        ctx.lineCap = "round";
        const p = size * 0.25;
        
        ctx.shadowBlur = 10;
        
        if (type === "X") {
            ctx.strokeStyle = "#f43f5e"; // Rose 500
            ctx.shadowColor = "#f43f5e";
            ctx.beginPath();
            ctx.moveTo(x+p, y+p); ctx.lineTo(x+size-p, y+size-p);
            ctx.moveTo(x+size-p, y+p); ctx.lineTo(x+p, y+size-p);
            ctx.stroke();
        } else {
            ctx.strokeStyle = "#38bdf8"; // Sky 400
            ctx.shadowColor = "#38bdf8";
            ctx.beginPath();
            ctx.arc(x+size/2, y+size/2, size/2-p, 0, Math.PI*2);
            ctx.stroke();
        }
        ctx.shadowBlur = 0; // Reset shadow
    }

    function resetGame() {
        board = {}; turn = "X"; gameOver = false; lastMove = null;
        statusEl.innerHTML = `Lượt của: <span class="turn-x">Bạn (X)</span>`;
    }

    init();
</script>
</body>
</html>
