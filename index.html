<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caro Nightmare - AI Bất Bại</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #121212; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(30, 30, 30, 0.95); color: #fff;
            padding: 20px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            pointer-events: none; width: 260px; border: 1px solid #333;
        }
        h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: #ff4757; text-transform: uppercase; letter-spacing: 1px; }
        .turn-x { color: #ff4757; font-weight: bold; }
        .turn-o { color: #2ed573; font-weight: bold; }
        .info { font-size: 0.9rem; color: #ccc; line-height: 1.6; margin-bottom: 20px; }
        #reset { 
            pointer-events: auto; cursor: pointer;
            background: #ff4757; color: white; border: none; padding: 12px; 
            border-radius: 6px; width: 100%; font-weight: bold; font-size: 1rem;
            transition: 0.2s; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        #reset:hover { background: #ff6b81; transform: translateY(-2px); }
        #status { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>

<div id="ui">
    <h2>☠️ NIGHTMARE AI</h2>
    <div id="status">Lượt: <span class="turn-x">Bạn (X)</span></div>
    <div class="info">
        • AI này đánh theo hệ điểm trọng số cực cao.<br>
        • Ưu tiên: <span style="color:#2ed573">Tấn công</span> & <span style="color:#ffa502">Chặn đứng</span>.<br>
        • Ô <b style="color: #f1c40f; border: 1px solid #f1c40f; padding: 0 4px;">Vàng</b>: Nước vừa đi.
    </div>
    <button id="reset" onclick="resetGame()">THỬ LẠI</button>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    // Cấu hình bàn cờ
    let board = {}; 
    let turn = "X";
    let gameOver = false;
    let lastMove = null; 
    let camera = { x: 0, y: 0, zoom: 1 };
    let isDragging = false;
    let lastMousePos = { x: 0, y: 0 };
    const cellSize = 45; // Ô to hơn chút cho dễ nhìn

    // --- CẤU HÌNH AI "KHỦNG" ---
    // Bảng điểm tấn công (Attack) và Phòng thủ (Defense)
    const ATK_SCORES = [0, 10, 100, 1000, 10000, 10000000]; // 1, 2, 3, 4, 5 quân
    const DEF_SCORES = [0, 15, 200, 2500, 100000, 10000000]; // AI sợ thua nên điểm thủ cao hơn công ở mức thấp

    function init() {
        window.addEventListener('resize', resize);
        resize();
        canvas.addEventListener('mousedown', (e) => { isDragging = false; lastMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    isDragging = true;
                    camera.x += dx; camera.y += dy;
                    lastMousePos = { x: e.clientX, y: e.clientY };
                }
            }
        });
        canvas.addEventListener('wheel', (e) => {
            camera.zoom *= (e.deltaY > 0 ? 0.9 : 1.1);
            camera.zoom = Math.min(Math.max(camera.zoom, 0.4), 2.5);
        });
        canvas.addEventListener('click', handleClick);
        render();
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    function screenToWorld(sx, sy) {
        const x = Math.floor((sx - canvas.width/2 - camera.x) / (cellSize * camera.zoom));
        const y = Math.floor((sy - canvas.height/2 - camera.y) / (cellSize * camera.zoom));
        return { x, y };
    }

    function handleClick(e) {
        if (isDragging || gameOver || turn === "O") return;
        const pos = screenToWorld(e.clientX, e.clientY);
        if (!board[`${pos.x},${pos.y}`]) {
            makeMove(pos.x, pos.y, "X");
            if (!gameOver) {
                statusEl.innerHTML = `<span class="turn-o">AI đang tính toán...</span>`;
                // Cho trình duyệt thở 1 chút để render UI
                setTimeout(aiTurn, 50);
            }
        }
    }

    function makeMove(x, y, p) {
        board[`${x},${y}`] = p;
        lastMove = { x, y };
        if (checkWin(x, y, p)) {
            statusEl.innerHTML = p === "X" ? "<span class='turn-x'>BẠN ĐÃ THẮNG (KHÓ TIN!)</span>" : "<span class='turn-o'>AI ĐÃ CHIẾN THẮNG!</span>";
            gameOver = true;
        } else {
            turn = p === "X" ? "O" : "X";
            statusEl.innerHTML = `Lượt: <span class="turn-${turn.toLowerCase()}">${turn === "X" ? "Bạn (X)" : "AI (O)"}</span>`;
        }
    }

    // --- LOGIC AI MẠNH NHẤT (HEURISTIC MAXIMIZATION) ---
    function aiTurn() {
        if (gameOver) return;

        // 1. Tìm tất cả các ô trống có thể đánh (gần các quân đã đánh)
        let candidates = getCandidates();
        if (candidates.length === 0) {
            makeMove(0, 0, "O");
            return;
        }

        let bestMove = null;
        let maxScore = -Infinity;

        // 2. Duyệt qua từng ô ứng viên và chấm điểm
        for (let cand of candidates) {
            let attackScore = evaluatePoint(cand.x, cand.y, "O"); // Điểm nếu AI đánh vào đây
            let defenseScore = evaluatePoint(cand.x, cand.y, "X"); // Điểm nguy hiểm nếu để User đánh vào đây

            // Chiến thuật: Lấy công bù thủ, nhưng nếu nguy cấp phải thủ ngay
            // Nếu AI sắp thắng (4 nước), attackScore sẽ cực lớn -> đánh luôn.
            // Nếu User sắp thắng, defenseScore sẽ cực lớn -> chặn luôn.
            let totalScore = attackScore + defenseScore;

            if (totalScore > maxScore) {
                maxScore = totalScore;
                bestMove = cand;
            }
        }

        if (bestMove) makeMove(bestMove.x, bestMove.y, "O");
    }

    // Lấy danh sách các ô trống xung quanh quân đã có (phạm vi 2 ô)
    function getCandidates() {
        let coords = new Set();
        for (let key in board) {
            let [x, y] = key.split(',').map(Number);
            for (let i = -2; i <= 2; i++) {
                for (let j = -2; j <= 2; j++) {
                    let k = `${x+i},${y+j}`;
                    if (!board[k]) coords.add(k);
                }
            }
        }
        return Array.from(coords).map(k => {
            let [x, y] = k.split(',').map(Number);
            return {x, y};
        });
    }

    // Hàm chấm điểm quan trọng nhất
    function evaluatePoint(x, y, player) {
        let totalScore = 0;
        const dirs = [[1,0], [0,1], [1,1], [1,-1]]; // Ngang, Dọc, Chéo 1, Chéo 2

        for (let [dx, dy] of dirs) {
            // Đếm số quân liên tiếp và kiểm tra chặn 2 đầu
            let count = 0;
            let blocks = 0;
            let spaceBefore = false; // Có khoảng trống trước chuỗi không? (cho thế cờ Live 3)
            let spaceAfter = false;

            // Tiến về 1 phía
            let i = 1;
            while (true) {
                let nx = x + dx * i, ny = y + dy * i;
                let cell = board[`${nx},${ny}`];
                if (cell === player) { count++; }
                else if (cell === undefined) { spaceAfter = true; break; } // Gặp ô trống
                else { blocks++; break; } // Bị chặn
                i++;
            }

            // Tiến về phía ngược lại
            i = 1;
            while (true) {
                let nx = x - dx * i, ny = y - dy * i;
                let cell = board[`${nx},${ny}`];
                if (cell === player) { count++; }
                else if (cell === undefined) { spaceBefore = true; break; }
                else { blocks++; break; }
                i++;
            }

            // --- TÍNH ĐIỂM DỰA TRÊN HÌNH THÁI CỜ ---
            // 5 ô liên tiếp -> Thắng ngay
            if (count >= 4) totalScore += ATK_SCORES[5]; 
            
            // 4 ô liên tiếp
            else if (count === 3) {
                if (blocks === 0) totalScore += 50000; // Live 4 (Không bị chặn) -> Chắc chắn thắng
                else totalScore += 10000; // Dead 4 (Bị chặn 1 đầu) -> Phải chặn/đánh ngay
            }
            
            // 3 ô liên tiếp
            else if (count === 2) {
                if (blocks === 0) totalScore += 5000; // Live 3 (Nước đôi nguy hiểm)
                else totalScore += 100; // Dead 3 (Ít nguy hiểm)
            }
            
            // 2 ô liên tiếp
            else if (count === 1) {
                if (blocks === 0) totalScore += 20; 
                else totalScore += 5;
            }
        }
        return totalScore;
    }

    function checkWin(x, y, p) {
        const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        for (let [dx, dy] of dirs) {
            let count = 1;
            let i = 1;
            while (board[`${x + dx*i},${y + dy*i}`] === p) { count++; i++; }
            i = 1;
            while (board[`${x - dx*i},${y - dy*i}`] === p) { count++; i++; }
            if (count >= 5) return true;
        }
        return false;
    }

    // --- RENDER GAME ---
    function render() {
        ctx.fillStyle = "#121212";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const currentCell = cellSize * camera.zoom;
        const offX = (canvas.width/2 + camera.x) % currentCell;
        const offY = (canvas.height/2 + camera.y) % currentCell;

        // Vẽ lưới tối màu
        ctx.beginPath(); ctx.strokeStyle = "#333"; ctx.lineWidth = 1;
        for (let x = offX; x < canvas.width; x += currentCell) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
        for (let y = offY; y < canvas.height; y += currentCell) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
        ctx.stroke();

        // Highlight nước đi cuối
        if (lastMove) {
            const lx = lastMove.x * currentCell + canvas.width/2 + camera.x;
            const ly = lastMove.y * currentCell + canvas.height/2 + camera.y;
            ctx.shadowBlur = 15; ctx.shadowColor = "#f1c40f";
            ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3;
            ctx.strokeRect(lx + 5, ly + 5, currentCell - 10, currentCell - 10);
            ctx.shadowBlur = 0;
        }

        for (let key in board) {
            const [bx, by] = key.split(',').map(Number);
            const pX = bx * currentCell + canvas.width/2 + camera.x;
            const pY = by * currentCell + canvas.height/2 + camera.y;
            if (pX + currentCell > 0 && pX < canvas.width && pY + currentCell > 0 && pY < canvas.height) {
                drawPiece(pX, pY, board[key], currentCell);
            }
        }
        requestAnimationFrame(render);
    }

    function drawPiece(x, y, type, size) {
        ctx.lineWidth = size * 0.15;
        const p = size * 0.25;
        ctx.lineCap = "round";
        
        if (type === "X") {
            ctx.strokeStyle = "#ff4757"; // Đỏ Neon
            ctx.beginPath();
            ctx.moveTo(x+p, y+p); ctx.lineTo(x+size-p, y+size-p);
            ctx.moveTo(x+size-p, y+p); ctx.lineTo(x+p, y+size-p);
            ctx.stroke();
        } else {
            ctx.strokeStyle = "#2ed573"; // Xanh Neon
            ctx.beginPath();
            ctx.arc(x+size/2, y+size/2, size/2-p, 0, Math.PI*2);
            ctx.stroke();
        }
    }

    function resetGame() {
        board = {}; turn = "X"; gameOver = false; lastMove = null;
        camera = { x: 0, y: 0, zoom: 1 };
        statusEl.innerHTML = `Lượt: <span class="turn-x">Bạn (X)</span>`;
    }

    init();
</script>
</body>
</html>
